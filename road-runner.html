  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #9fc6ee;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

#game, #game canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.hidden { display: none !important; }

#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  color: #fff;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
  font-weight: 800;
}
#score { position: absolute; top: 16px; left: 20px; font-size: 32px; letter-spacing: 1px; }
#cash {
  position: absolute; top: 18px; right: 20px; font-size: 26px;
  display: flex; align-items: center; gap: 8px;
}
#cash .note {
  width: 34px; height: 18px; border-radius: 3px;
  background: linear-gradient(135deg, #8fd18f, #3f8f4f);
  border: 2px solid #2b6b38;
}
#powers {
  position: absolute; top: 60px; right: 20px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
}
.power { font-size: 13px; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
.power .bar { width: 90px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.3); overflow: hidden; }
.power .bar i { display: block; height: 100%; background: #ffd23f; }

#vignette {
  position: fixed; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(10, 10, 20, 0.85) 100%);
  transition: opacity 0.25s;
}

#flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle, #ffffff 0%, #b8ffd0 60%, transparent 100%); }
#flash.on { animation: flash 0.6s ease-out; }
@keyframes flash { 0% { opacity: 0.95; } 100% { opacity: 0; } }

#blood { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#blood .splat {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, rgba(150, 0, 0, 0.95), rgba(95, 0, 0, 0.9) 60%, rgba(70, 0, 0, 0) 72%);
  animation: splat 0.18s ease-out;
}
#blood .drip {
  position: absolute; width: 10px; border-radius: 0 0 6px 6px;
  background: linear-gradient(rgba(120, 0, 0, 0.9), rgba(80, 0, 0, 0.85));
  animation: drip 2.4s ease-in forwards;
}
@keyframes splat { from { transform: scale(0.2); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
@keyframes drip { from { height: 0; } to { height: var(--len); } }

#menu {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  background: linear-gradient(180deg, rgba(15, 20, 40, 0.15), rgba(15, 20, 40, 0.55));
  color: #fff; text-align: center; padding: 16px;
}
#menu h1 {
  font-size: clamp(40px, 9vw, 84px); font-weight: 900; letter-spacing: 4px;
  text-shadow: 0 4px 0 #c0392b, 0 8px 18px rgba(0, 0, 0, 0.4);
}
#best, #last { font-size: 20px; font-weight: 700; letter-spacing: 2px; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); }
#best strong { color: #ffd23f; font-size: 28px; margin-left: 6px; }
#last strong { font-size: 24px; margin-left: 6px; }
#play {
  margin-top: 8px; padding: 16px 64px; font-size: 28px; font-weight: 900; letter-spacing: 4px;
  color: #fff; background: #e74c3c; border: none; border-radius: 14px; cursor: pointer;
  box-shadow: 0 6px 0 #a93226, 0 10px 24px rgba(0, 0, 0, 0.35);
  transition: transform 0.08s, box-shadow 0.08s;
}
#play:hover { transform: translateY(-2px); }
#play:active { transform: translateY(4px); box-shadow: 0 2px 0 #a93226, 0 4px 10px rgba(0, 0, 0, 0.35); }
#revive {
  padding: 10px 26px; font-size: 16px; font-weight: 800; letter-spacing: 1px;
  color: #1b1b1b; background: #ffd23f; border: none; border-radius: 10px; cursor: pointer;
  box-shadow: 0 4px 0 #b7950b;
}
#credits {
  position: absolute; bottom: 18px; left: 16px; right: 16px;
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px 16px;
  font-size: 14px; font-weight: 600; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
}
#coffee {
  padding: 8px 16px; border-radius: 10px; font-weight: 800; color: #1b1b1b; text-decoration: none; text-shadow: none;
  background: #ffdd00; box-shadow: 0 3px 0 #b39b00;
}
#coffee:hover { transform: translateY(-1px); }
#lolno {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: clamp(56px, 14vw, 140px); font-weight: 900; color: #fff;
  background: rgba(10, 10, 20, 0.85); text-shadow: 0 6px 0 #c0392b;
  animation: lolno 1.1s ease-out;
}
@keyframes lolno { 0% { transform: scale(0.4) rotate(-8deg); } 25% { transform: scale(1.15) rotate(3deg); } 40% { transform: scale(1); } }

      this.effects.burst(e.x, e.baseY + 1, z, size, e.blastDelay);
    }
    for (const b of this.env.collapse(from, to, this.s)) {
      this.effects.burst(b.x - Math.sign(b.x) * 4, 2, b.z, b.size, b.delay);
    }
    this.effects.shockwave(p.x, p.y + 0.3, 0);
    this.pursuer.closeT = 0;
  }
  // ------------------------------------------------------------ pickups
  pickUp(e) {
    e.collected = true;
    if (e.kind === "cash") {
      this.cash++;
      return;
    }
    this.player.activate(e.collect);
    if (e.collect === "wings") this.spawner.wingsRun(this.s);
    if (e.collect === "glider") this.spawner.gliderRun(this.s);
  }
  // Banknotes flying to the player: the magnet grabs everything nearby, and the pogo stick
  // pulls up any notes directly underneath you while you're in the air.
  attract(dt) {
    const p = this.player;
    const magnet = p.power.magnet > 0;
    const pogo = p.power.pogo > 0 && !p.grounded;
    const target = new THREE5.Vector3(p.x, p.y + 1, this.s);
    const pos = new THREE5.Vector3();
    const step = (30 + this.speed) * dt;
    for (const e of this.level.entities) {
      if (e.kind !== "cash" || e.collected) continue;
      if (!e.magnet) {
        const ds = e.s - this.s;
        const byMagnet = magnet && ds <= POWERUP.magnet.radius && ds >= -2;
        const byPogo = pogo && Math.abs(e.x - p.x) < 1 && Math.abs(ds) < 3 && e.baseY < p.y + 0.5;
        if (!byMagnet && !byPogo) continue;
        e.magnet = true;
      }
      pos.set(e.x, e.baseY, e.s);
      const dist = pos.distanceTo(target);
      if (dist < 0.8) {
        this.pickUp(e);
        continue;
      }
      pos.lerp(target, Math.min(1, step / dist));
      e.x = pos.x;
      e.baseY = pos.y;
      e.s = pos.z;
    }
  }
  // ------------------------------------------------------------ death
  caught() {
    if (this.skateAbsorb()) return;
    this.state = "caught";
    this.caughtT = 0;
    this.stabbed = 0;
    this.pooled = false;
    this.finalScore = this.score;
    this.player.rig.root.visible = true;
    this.ui.setDanger(0.9);
  }
  updateCaught(dt) {
    this.caughtT += dt;
    const t = this.caughtT;
    const p = this.player;
    this.pursuer.catchAnimation(t, p);
    while (this.stabbed < Pursuer.STAB_TIMES.length && t >= Pursuer.STAB_TIMES[this.stabbed]) {
      this.stabbed++;
      this.shake = 0.3;
      this.effects.blood(p.x, p.y + 1.2, 0.2, 1 + this.stabbed);
      this.ui.bloodSplat(this.stabbed === 1 ? 5 : 9);
    }
    if (t > 1.1 && !this.pooled) {
      this.pooled = true;
      this.effects.bloodPool(p.x, p.y + 0.02, -0.6);
    }
    if (t > 0.65) {
      const fall = Math.min(1, (t - 0.65) / 0.45);
      p.rig.root.rotation.x = -(Math.PI / 2) * fall * fall;
      poseDead(p.rig);
      p.rig.root.position.y = Math.max(0, p.y);
    } else {
      p.rig.body.rotation.set(0.15, 0, 0);
      p.rig.armL.rotation.set(1.6, 0, -0.3);
      p.rig.armR.rotation.set(1.6, 0, 0.3);
    }
    if (t >= CAUGHT_DURATION) {
      this.state = "menu";
      this.ui.showMenu(this.finalScore);
    }
  }
  // ------------------------------------------------------------ camera
  updateCamera(dt) {
    const p = this.player;
    const cam = this.camera;
    const k = Math.min(1, dt * 5);
    let pos, look;
    if (this.state === "caught") {
      const f = Math.min(1, this.caughtT / 0.8);
      pos = new THREE5.Vector3(p.x + 4.5 * f, p.y + 3.2 - f, 6.5 - 2 * f);
      look = new THREE5.Vector3(p.x, p.y + 1, 0);
    } else {
      pos = new THREE5.Vector3(p.x * 0.7, 4.3 + p.y * 0.85, 7.6);
      look = new THREE5.Vector3(p.x * 0.85, 0.8 + p.y * 0.85, -10);
    }
    cam.position.lerp(pos, k);
    this.camLook.lerp(look, k);
    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt);
      cam.position.x += (Math.random() - 0.5) * this.shake;
      cam.position.y += (Math.random() - 0.5) * this.shake;
    }
    cam.lookAt(this.camLook);
    this.sun.position.set(p.x + 8, p.y + 20, 6);
    this.sun.target.position.set(p.x, p.y, -8);
  }
};

// src/input.js
var KEYS = {
  ArrowLeft: "left",
  KeyA: "left",
  ArrowRight: "right",
  KeyD: "right",
  ArrowUp: "jump",
  KeyW: "jump",
  Space: "jump",
  ArrowDown: "slide",
  KeyS: "slide"
};
var SWIPE_MIN = 30;
var Input = class {
  constructor() {
    this.queue = [];
    window.addEventListener("keydown", (e) => {
      const action = KEYS[e.code];
      if (!action) return;
      e.preventDefault();
      if (!e.repeat) this.queue.push(action);
    });
    let start = null;
    window.addEventListener("touchstart", (e) => {
      const t = e.changedTouches[0];
      start = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    window.addEventListener("touchmove", (e) => {
      if (!start) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - start.x;
      const dy = t.clientY - start.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
      if (Math.abs(dx) > Math.abs(dy)) this.queue.push(dx < 0 ? "left" : "right");
      else this.queue.push(dy < 0 ? "jump" : "slide");
      start = null;
    }, { passive: true });
    window.addEventListener("touchend", () => {
      start = null;
    });
  }
  consume() {
    const q = this.queue;
    this.queue = [];
    return q;
  }
};

// src/ui.js
var $ = (id) => document.getElementById(id);
var POWER_LABELS = {
  magnet: "MAGNET",
  pogo: "POGO STICK",
  glider: "GLIDER",
  wings: "METAL WINGS",
  skateboard: "SKATEBOARD",
  boots: "SUPER BOOTS",
  multiplier: "2X SCORE"
};
var UI = class _UI {
  constructor(onPlay) {
    this.menu = $("menu");
    this.hud = $("hud");
    this.vignette = $("vignette");
    this.flashEl = $("flash");
    this.flashEl.addEventListener("animationend", () => this.flashEl.classList.remove("on"));
    this.bloodEl = $("blood");
    $("play").addEventListener("click", (e) => {
      e.currentTarget.blur();
      onPlay();
    });
    $("revive").addEventListener("click", (e) => {
      e.currentTarget.blur();
      const toast = $("lolno");
      toast.classList.remove("hidden");
      setTimeout(() => {
        toast.classList.add("hidden");
        onPlay();
      }, 1100);
    });
    this.highScore = _UI.loadHighScore();
    $("best-value").textContent = this.highScore;
    this.lastHud = "";
  }
  static loadHighScore() {
    try {
      return Number(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
    } catch {
      return 0;
    }
  }
  showMenu(lastScore) {
    if (lastScore !== void 0) {
      if (lastScore > this.highScore) {
        this.highScore = lastScore;
        try {
          localStorage.setItem(HIGH_SCORE_KEY, String(lastScore));
        } catch {
        }
      }
      $("last-value").textContent = lastScore;
      $("last").classList.remove("hidden");
      $("revive").classList.remove("hidden");
    }
    $("best-value").textContent = this.highScore;
    this.menu.classList.remove("hidden");
    this.hud.classList.add("hidden");
  }
  showGame() {
    this.bloodEl.innerHTML = "";
    $("revive").classList.add("hidden");
    this.menu.classList.add("hidden");
    this.hud.classList.remove("hidden");
    this.setDanger(0);
  }
  setHud(score, cash, power) {
    $("score").textContent = score;
    $("cash-count").textContent = cash;
    const active = Object.entries(power).filter(([, t]) => t > 0);
    const html = active.map(
      ([k, t]) => `<div class="power">${POWER_LABELS[k]}<span class="bar"><i style="width:${100 * t / POWERUP[k].duration}%"></i></span></div>`
    ).join("");
    if (html !== this.lastHud) {
      $("powers").innerHTML = html;
      this.lastHud = html;
    }
  }
  // Blood spattered on the "camera" when the killer strikes.
  bloodSplat(count) {
    const w = window.innerWidth, h = window.innerHeight;
    for (let i = 0; i < count; i++) {
      const size = 40 + Math.random() * 160;
      const x = Math.random() * w, y = Math.random() * h * 0.85;
      const splat = document.createElement("div");
      splat.className = "splat";
      Object.assign(splat.style, { left: `${x - size / 2}px`, top: `${y - size / 2}px`, width: `${size}px`, height: `${size * (0.7 + Math.random() * 0.5)}px` });
      this.bloodEl.appendChild(splat);
      for (let k = 0; k < 4; k++) {
        const d = document.createElement("div");
        d.className = "splat";
        const ds = 6 + Math.random() * 22;
        const a = Math.random() * Math.PI * 2, r = size * (0.5 + Math.random() * 0.5);
        Object.assign(d.style, { left: `${x + Math.cos(a) * r}px`, top: `${y + Math.sin(a) * r}px`, width: `${ds}px`, height: `${ds}px` });
        this.bloodEl.appendChild(d);
      }
      if (Math.random() < 0.7) {
        const drip = document.createElement("div");
        drip.className = "drip";
        drip.style.left = `${x - 5 + (Math.random() - 0.5) * size * 0.4}px`;
        drip.style.top = `${y}px`;
        drip.style.setProperty("--len", `${60 + Math.random() * 160}px`);
        this.bloodEl.appendChild(drip);
      }
    }
  }
  // Bright flash for the skateboard blast.
  flash() {
    this.flashEl.classList.remove("on");
    void this.flashEl.offsetWidth;
    this.flashEl.classList.add("on");
  }
  // Darkens the screen edges as the killer closes in (0..1).
  setDanger(level) {
    this.vignette.style.opacity = level.toFixed(2);
  }
};

// src/main.js
var renderer = new THREE6.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE6.PCFSoftShadowMap;
document.getElementById("game").appendChild(renderer.domElement);
var input = new Input();
var game;
var ui = new UI(() => game.start());
game = new Game(renderer, input, ui);
window.addEventListener("resize", () => game.resize());
if (new URLSearchParams(location.search).has("debug")) window.game = game;
var last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1e3);
  last = now;
  game.tick(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
  </script>
